version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: persona_db
      POSTGRES_USER: persona_user
      POSTGRES_PASSWORD: persona_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona_user -d persona_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
